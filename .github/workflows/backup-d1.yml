name: Backup D1 to R2
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-d1
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            database: ${{ vars.STAGING_D1_DATABASE_NAME }}
            bucket: whatrdp-backups-staging
          - environment: production
            database: ${{ vars.PRODUCTION_D1_DATABASE_NAME }}
            bucket: whatrdp-backups-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Export, verify and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BACKUP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BACKUP_CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npm run backup --
          --environment "${{ matrix.environment }}"
          --database "${{ matrix.database }}"
          --bucket "${{ matrix.bucket }}"
